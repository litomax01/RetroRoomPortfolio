<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chess</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14101c; color: #f2ead8; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  #bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: 14px; }
  button, select { background: #2a2038; color: #f2ead8; border: 1px solid #5df2ff; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #3a2c52; }
  #status { min-height: 1.4em; font-weight: 600; text-align: center; }
  #board { width: min(100%, calc(100vh - 110px)); aspect-ratio: 1; display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr); border: 4px solid #5a3a1e; box-shadow: 0 0 24px rgba(93, 242, 255, 0.35); user-select: none; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; font-size: min(7vw, calc((100vh - 110px) / 8 * 0.8)); line-height: 1; cursor: pointer; }
  .l { background: #e8d4a0; }
  .d { background: #8b5a2b; }
  .sel { outline: 4px solid #ffd84d; outline-offset: -4px; }
  .last { box-shadow: inset 0 0 0 100px rgba(255, 216, 77, 0.28); }
  .hint::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(40, 160, 90, 0.65); }
  .hint.cap::after { width: 90%; height: 90%; background: none; border: 5px solid rgba(220, 60, 60, 0.7); }
  .chk { background: #d9503f; }
  .w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000; }
  .b { color: #111; text-shadow: 0 0 1px #fff; }
</style>
</head>
<body>
<div id="bar">
  <button id="new"></button>
  <select id="mode"></select>
  <select id="level"></select>
  <button id="undo"></button>
</div>
<div id="status" role="status"></div>
<div id="board"></div>
<p style="font-size:11px;opacity:.6;margin:0" id="credit"></p>

<script type="module">
import { Chess } from './chess.js';

const es = (window.parent?.document?.documentElement?.lang || navigator.language || 'es').startsWith('es');
const T = es
  ? { new: 'Nueva partida', ai: 'Contra la máquina', two: '2 jugadores', easy: 'Fácil', mid: 'Medio', hard: 'Difícil', undo: 'Deshacer', white: 'Turno de blancas', black: 'Turno de negras', think: 'Pensando…', check: ' · ¡Jaque!', mateW: 'Jaque mate: ganan las blancas', mateB: 'Jaque mate: ganan las negras', draw: 'Tablas', credit: 'Reglas: chess.js (BSD-2-Clause)' }
  : { new: 'New game', ai: 'Vs computer', two: '2 players', easy: 'Easy', mid: 'Medium', hard: 'Hard', undo: 'Undo', white: "White's turn", black: "Black's turn", think: 'Thinking…', check: ' · Check!', mateW: 'Checkmate: White wins', mateB: 'Checkmate: Black wins', draw: 'Draw', credit: 'Rules: chess.js (BSD-2-Clause)' };

const $ = (id) => document.getElementById(id);
$('new').textContent = T.new;
$('undo').textContent = T.undo;
$('credit').textContent = T.credit;
$('mode').innerHTML = `<option value="ai">${T.ai}</option><option value="two">${T.two}</option>`;
$('level').innerHTML = `<option value="1">${T.easy}</option><option value="2" selected>${T.mid}</option><option value="3">${T.hard}</option>`;

const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const VAL = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };
const game = new Chess();
let selected = null;
let last = null;
let busy = false;

// Evaluacion: material + pequeño bono por centralizar piezas
function evaluate(g) {
  let s = 0;
  for (const row of g.board()) for (const p of row) {
    if (!p) continue;
    const i = 'abcdefgh'.indexOf(p.square[0]), j = Number(p.square[1]) - 1;
    const cen = 3.5 - Math.max(Math.abs(i - 3.5), Math.abs(j - 3.5));
    const v = VAL[p.type] + (p.type === 'p' ? (p.color === 'w' ? j : 7 - j) * 6 : cen * 4);
    s += p.color === 'w' ? v : -v;
  }
  return s;
}

function search(g, depth, alpha, beta) {
  if (g.isCheckmate()) return g.turn() === 'w' ? -99999 - depth : 99999 + depth;
  if (depth === 0 || g.isDraw()) return g.isDraw() ? 0 : evaluate(g);
  const maxing = g.turn() === 'w';
  let best = maxing ? -Infinity : Infinity;
  for (const m of g.moves()) {
    g.move(m);
    const v = search(g, depth - 1, alpha, beta);
    g.undo();
    if (maxing) { best = Math.max(best, v); alpha = Math.max(alpha, v); } else { best = Math.min(best, v); beta = Math.min(beta, v); }
    if (beta <= alpha) break;
  }
  return best;
}

function aiMove() {
  const depth = Number($('level').value);
  const moves = game.moves();
  moves.sort(() => Math.random() - 0.5);
  const maxing = game.turn() === 'w';
  let best = null, bestV = maxing ? -Infinity : Infinity;
  for (const m of moves) {
    game.move(m);
    const v = depth === 1 && Math.random() < 0.35 ? Math.random() * 200 - 100 : search(game, depth - 1, -Infinity, Infinity);
    game.undo();
    if (maxing ? v > bestV : v < bestV) { bestV = v; best = m; }
  }
  return best;
}

function status() {
  if (game.isCheckmate()) return game.turn() === 'w' ? T.mateB : T.mateW;
  if (game.isDraw()) return T.draw;
  return (game.turn() === 'w' ? T.white : T.black) + (game.inCheck() ? T.check : '');
}

function render() {
  const el = $('board');
  el.innerHTML = '';
  const hints = selected ? game.moves({ square: selected, verbose: true }) : [];
  const kingSq = game.inCheck() ? game.board().flat().find((p) => p && p.type === 'k' && p.color === game.turn())?.square : null;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const sq = 'abcdefgh'[c] + (8 - r);
    const p = game.get(sq);
    const d = document.createElement('div');
    d.className = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    if (sq === selected) d.classList.add('sel');
    if (last && (sq === last.from || sq === last.to)) d.classList.add('last');
    if (sq === kingSq) d.classList.add('chk');
    const h = hints.find((m) => m.to === sq);
    if (h) d.classList.add('hint', ...(h.captured ? ['cap'] : []));
    if (p) { const s = document.createElement('span'); s.className = p.color; s.textContent = GLYPH[p.type]; d.appendChild(s); }
    d.addEventListener('click', () => click(sq));
    el.appendChild(d);
  }
  $('status').textContent = busy ? T.think : status();
}

function play(from, to) {
  const m = game.move({ from, to, promotion: 'q' });
  if (m) last = { from: m.from, to: m.to };
  return m;
}

function click(sq) {
  if (busy || game.isGameOver()) return;
  const ai = $('mode').value === 'ai';
  if (ai && game.turn() === 'b') return;
  const p = game.get(sq);
  if (selected && selected !== sq && game.moves({ square: selected, verbose: true }).some((m) => m.to === sq)) {
    play(selected, sq);
    selected = null;
    render();
    if (ai && !game.isGameOver()) {
      busy = true;
      render();
      setTimeout(() => {
        const m = aiMove();
        if (m) { const r = game.move(m); last = { from: r.from, to: r.to }; }
        busy = false;
        render();
      }, 60);
    }
    return;
  }
  selected = p && p.color === game.turn() ? sq : null;
  render();
}

$('new').onclick = () => { game.reset(); selected = null; last = null; busy = false; render(); };
$('mode').onchange = $('new').onclick;
$('undo').onclick = () => {
  if (busy) return;
  game.undo();
  if ($('mode').value === 'ai' && game.turn() === 'b') game.undo(); // vuelve siempre al turno de las blancas
  selected = null; last = null; render();
};
render();
</script>
</body>
</html>
