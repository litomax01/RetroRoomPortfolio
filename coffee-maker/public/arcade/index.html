<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pac-Man</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #host { position: fixed; inset: 0; }
  #host ruffle-player { width: 100%; height: 100%; display: block; }
  #msg { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; color: #ffd84d; font: 14px/1.8 monospace; pointer-events: none; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { publicPath: 'ruffle/', autoplay: 'on', unmuteOverlay: 'hidden', letterbox: 'on', contextMenu: 'off' };
</script>
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="host"></div>
<div id="msg">Cargando…</div>
<script>
/* Pac-Man (Flash, pacman.swf) corre en Ruffle (Flash → WebAssembly) servido desde ruffle/. */
(function () {
  var msg = document.getElementById('msg');
  var host = document.getElementById('host');
  if (!window.RufflePlayer || !window.RufflePlayer.newest) { msg.textContent = 'Falta el emulador (carpeta ruffle)'; return; }

  var player = window.RufflePlayer.newest().createPlayer();
  host.appendChild(player);
  player.load('pacman.swf').then(function () {
    msg.textContent = '';
    player.focus();
  }).catch(function () { msg.textContent = 'No se pudo cargar el juego'; });

  /* La app envía el volumen (0–1) desde su control deslizante. */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'arcade-volume') return;
    var v = Number(e.data.v);
    if (isFinite(v)) player.volume = Math.min(1, Math.max(0, v));
  });
  window.addEventListener('pointerdown', function () { window.focus(); player.focus(); });
})();
</script>
</body>
</html>
